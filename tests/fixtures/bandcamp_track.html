<!DOCTYPE html>
<!--
  Bandcamp 专辑页的精简样本（用于离线解析测试）。

  parse_bandcamp_html 只读 OpenGraph / Twitter meta，标题末尾的 " | Bandcamp"
  会被去掉 —— 这是该解析器唯一值得测的行为。
-->
<html lang="en">
<head>
  <meta property="og:title" content="Sample Track | Bandcamp">
  <meta property="og:image" content="https://f4.bcbits.com/img/a1234567890_10.jpg">
  <meta property="og:description" content="Sample description for offline parser tests.">
</head>
<body>
  <p>Catalog number: BC-99887</p>
</body>
</html>
